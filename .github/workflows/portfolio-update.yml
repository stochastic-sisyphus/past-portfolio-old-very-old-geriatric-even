name: Update Portfolio

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Update submodules
        run: git submodule update --init --remote --merge
      - name: Run portfolio updater tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Update README with latest repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_portfolio.py --limit 8 --cache scripts/cache/latest_repos.json
      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m 'chore: update portfolio'
            git push
          else
            echo 'No changes to commit.'
          fi
